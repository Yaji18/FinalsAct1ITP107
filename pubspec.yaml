name: act1_finals_lab
description: A Matrix-themed Login, Sign-Up, and Home screen app using named routes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/background-with-floral-field-shadow.jpg
    - assets/images/avocado_toast.jpg
    - assets/images/matcha_latte.jpg
    - assets/images/cheesecake.jpg
    - assets/images/hot_latte.jpg
    - assets/images/iced_latte.jpg
    - assets/images/login_icon.jpg
    - assets/images/sign_up_icon.jpg